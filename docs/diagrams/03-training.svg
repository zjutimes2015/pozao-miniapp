<text class="ts" x="40" y="24" fill="#5F5E5A" dominant-baseline="central">PAGE-004 训练页 · 三模式切换 · 均从 65 题池与本地日志取数</text><rect x="40" y="40" width="192" height="118" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="56" y="58" fill="#04342C" dominant-baseline="central">每日三题</text><text class="ts" x="56" y="78" fill="#0F6E56" dominant-baseline="central">RULE-013 抽样策略</text><text class="ts" x="56" y="98" fill="#5F5E5A" dominant-baseline="central">最弱分组优先</text><text class="ts" x="56" y="116" fill="#5F5E5A" dominant-baseline="central">单维薄弱项优先</text><text class="ts" x="56" y="134" fill="#5F5E5A" dominant-baseline="central">轮换题库优先</text><text class="ts" x="56" y="152" fill="#5F5E5A" dominant-baseline="central">按 qid 去重 · 组间隔</text><rect x="244" y="40" width="192" height="118" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="260" y="58" fill="#26215C" dominant-baseline="central">论证质量 ARG</text><text class="ts" x="260" y="78" fill="#534AB7" dominant-baseline="central">RULE-007 三关判定</text><text class="ts" x="260" y="98" fill="#5F5E5A" dominant-baseline="central">A 可接受性 · R 相关性</text><text class="ts" x="260" y="116" fill="#5F5E5A" dominant-baseline="central">G 充分性</text><text class="ts" x="260" y="134" fill="#5F5E5A" dominant-baseline="central">逐项独立判定</text><text class="ts" x="260" y="152" fill="#5F5E5A" dominant-baseline="central">答后揭示隐藏前提</text><rect x="448" y="40" width="192" height="118" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/><text class="th" x="464" y="58" fill="#4B1528" dominant-baseline="central">怎么回</text><text class="ts" x="464" y="78" fill="#993556" dominant-baseline="central">RULE-009 四关筛查</text><text class="ts" x="464" y="98" fill="#5F5E5A" dominant-baseline="central">线性通过制</text><text class="ts" x="464" y="116" fill="#5F5E5A" dominant-baseline="central">停在第一个未过关</text><text class="ts" x="464" y="134" fill="#5F5E5A" dominant-baseline="central">第 3 关双分支应对</text><text class="ts" x="464" y="152" fill="#5F5E5A" dominant-baseline="central">输出话术模板</text><text class="ts" x="40" y="188" fill="#5F5E5A" dominant-baseline="central">RULE-008 · ARG 模式边界 —— 由代码强制，不是约定</text><rect x="40" y="204" width="290" height="128" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="56" y="222" fill="#04342C" dominant-baseline="central">ARG 启用</text><text class="tm" x="56" y="248" fill="#0F6E56" dominant-baseline="central">train    训练层</text><text class="tm" x="56" y="270" fill="#0F6E56" dominant-baseline="central">monthly  月测</text><text class="ts" x="56" y="296" fill="#5F5E5A" dominant-baseline="central">已有足够练习量后</text><text class="ts" x="56" y="314" fill="#5F5E5A" dominant-baseline="central">再引入三维评估框架</text><rect x="350" y="204" width="290" height="128" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text class="th" x="366" y="222" fill="#501313" dominant-baseline="central">ARG 禁用</text><text class="tm" x="366" y="248" fill="#A32D2D" dominant-baseline="central">solo    首测</text><text class="tm" x="366" y="270" fill="#A32D2D" dominant-baseline="central">versus  对攻</text><text class="ts" x="366" y="296" fill="#5F5E5A" dominant-baseline="central">首测目标是让用户发现</text><text class="ts" x="366" y="314" fill="#5F5E5A" dominant-baseline="central">自己不知道，不是教会框架</text><rect x="40" y="352" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><text class="th" x="56" y="370" fill="#1C1C1A" dominant-baseline="central">C-001 · 违反后果</text><text class="ts" x="56" y="390" fill="#5F5E5A" dominant-baseline="central">首测引入 ARG 会同时增加维度与认知负担，3 分钟流程会超载 —— 由 tests/e2e.test.js 边界断言拦截</text>
</svg>