<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500">

<style>
.th{font-family:var(--font-sans);font-size:13px;font-weight:500}
.ts{font-family:var(--font-sans);font-size:11px;font-weight:400}
.tm{font-family:var(--font-mono);font-size:10px;font-weight:400}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs><text class="ts" x="40" y="24" fill="#5F5E5A" dominant-baseline="central">首测链路 · 5 关 × 3 题 = 15 题 · 首关 ≤ 90 秒</text><rect x="40" y="42" width="330" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="th" x="56" y="58" fill="#042C53" dominant-baseline="central">PAGE-001 单闯页</text><text class="ts" x="56" y="74" fill="#185FA5" dominant-baseline="central">读取关卡进度，决定加载第几关</text><text class="tm" x="360" y="58" fill="#8B8A85" text-anchor="end" dominant-baseline="central">UI-001 关卡条 / UI-002 方向标签</text><path d="M205 86L205 104" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="108" width="330" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="th" x="56" y="124" fill="#042C53" dominant-baseline="central">UI-003 卡片 · UI-004 谬误选择</text><text class="ts" x="56" y="140" fill="#185FA5" dominant-baseline="central">呈现前提卡、结论卡、15 类谬误 chip</text><text class="tm" x="360" y="124" fill="#8B8A85" text-anchor="end" dominant-baseline="central">RULE-004 定义</text><path d="M205 152L205 170" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="174" width="330" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="56" y="190" fill="#412402" dominant-baseline="central">ACT-001 选断点 · ACT-002 选类型</text><text class="ts" x="56" y="206" fill="#854F0B" dominant-baseline="central">两个动作都缺失则不允许提交</text><text class="tm" x="360" y="190" fill="#8B8A85" text-anchor="end" dominant-baseline="central">C-003 必须用户作答</text><path d="M205 218L205 236" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="240" width="330" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text class="th" x="56" y="256" fill="#501313" dominant-baseline="central">RULE-001 真值表 · RULE-002 判定</text><text class="ts" x="56" y="272" fill="#A32D2D" dominant-baseline="central">形式类穷举判定，其余比对断点与类型</text><text class="tm" x="360" y="256" fill="#8B8A85" text-anchor="end" dominant-baseline="central">C-002 不得交给 AI</text><path d="M205 284L205 302" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="306" width="330" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="56" y="322" fill="#04342C" dominant-baseline="central">STORE-001 写入 pz_logs</text><text class="ts" x="56" y="338" fill="#0F6E56" dominant-baseline="central">唯一数据源，纯本地，不上传</text><text class="tm" x="360" y="322" fill="#8B8A85" text-anchor="end" dominant-baseline="central">FLOW-002 解锁下关</text><path d="M205 350L205 368" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="372" width="330" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="56" y="388" fill="#04342C" dominant-baseline="central">RULE-005 指纹聚合</text><text class="ts" x="56" y="404" fill="#0F6E56" dominant-baseline="central">贝叶斯平滑后按三组排序</text><text class="tm" x="360" y="388" fill="#8B8A85" text-anchor="end" dominant-baseline="central">minSamples 3</text><path d="M205 416L205 434" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="438" width="330" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="th" x="56" y="454" fill="#042C53" dominant-baseline="central">PAGE-003 指纹页 · CAP-005 卡片</text><text class="ts" x="56" y="470" fill="#185FA5" dominant-baseline="central">canvas 本地绘制，离线可分享</text><text class="tm" x="360" y="454" fill="#8B8A85" text-anchor="end" dominant-baseline="central">C-004 分享无奖励</text><rect x="396" y="42" width="244" height="150" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><text class="th" x="412" y="60" fill="#1C1C1A" dominant-baseline="central">这条链路的三个不可动点</text><text class="ts" x="412" y="84" fill="#A32D2D" dominant-baseline="central">C-002 真值表不可换成 AI 判断</text><text class="ts" x="412" y="106" fill="#A32D2D" dominant-baseline="central">C-003 谬误类型不可代用户选择</text><text class="ts" x="412" y="128" fill="#A32D2D" dominant-baseline="central">C-004 分享不可设奖励解锁</text><text class="ts" x="412" y="156" fill="#5F5E5A" dominant-baseline="central">违反任一条，指纹数据即失真</text><text class="ts" x="412" y="176" fill="#5F5E5A" dominant-baseline="central">或触发平台审核驳回</text>
</svg>