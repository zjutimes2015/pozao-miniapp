<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
<path d="M1 1L9 5L1 9" fill="none" stroke="#4FB79E" stroke-width="1.5" stroke-linecap="round"/>
</marker>
</defs>
<rect width="900" height="620" fill="#C6F1EA"/>

<!-- 分组框：细描边、小圆角（模拟 Mermaid subgraph 默认样式） -->
<rect x="60" y="40" width="180" height="70" rx="2" fill="none" stroke="#3FC7AE" stroke-width="1" stroke-dasharray="4 3" opacity="0.75"/>
<text x="150" y="34" font-size="11" fill="#0B3B34" text-anchor="middle" font-weight="bold">产品能力</text>

<!-- 节点：大圆角 + 自定义填充（模拟 classDef） -->
<rect x="95" y="55" width="110" height="42" rx="8" fill="#C6F1EA" stroke="#3FC7AE" stroke-width="1.5"/>
<text x="150" y="70" font-size="10" fill="#C8642A" text-anchor="middle" font-family="monospace">CAP-001</text>
<text x="150" y="84" font-size="13" fill="#0B3B34" text-anchor="middle" font-weight="bold">能力</text>
<text x="150" y="94" font-size="9" fill="#4A7A70" text-anchor="middle" font-style="italic">用户完成什么</text>

<rect x="60" y="160" width="500" height="120" rx="2" fill="none" stroke="#3FC7AE" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<text x="310" y="152" font-size="11" fill="#0B3B34" text-anchor="middle" font-weight="bold">前端页面</text>

<!-- 关键验证：节点压在分组框描边之上（描边被覆盖） -->
<rect x="100" y="172" width="110" height="42" rx="8" fill="#DFF7F2" stroke="#3FC7AE" stroke-width="1.5"/>
<text x="155" y="187" font-size="10" fill="#C8642A" text-anchor="middle" font-family="monospace">PAGE-001</text>
<text x="155" y="201" font-size="13" fill="#0B3B34" text-anchor="middle" font-weight="bold">首页</text>

<rect x="255" y="172" width="110" height="42" rx="8" fill="#DFF7F2" stroke="#3FC7AE" stroke-width="1.5"/>
<text x="310" y="187" font-size="10" fill="#C8642A" text-anchor="middle" font-family="monospace">PAGE-002</text>
<text x="310" y="201" font-size="13" fill="#0B3B34" text-anchor="middle" font-weight="bold">答题页</text>

<!-- UI 类：橙色系 -->
<rect x="155" y="250" width="110" height="42" rx="8" fill="#FFF3E0" stroke="#F0A868" stroke-width="1.5"/>
<text x="210" y="265" font-size="10" fill="#C8642A" text-anchor="middle" font-family="monospace">UI-001</text>
<text x="210" y="280" font-size="13" fill="#6B3A12" text-anchor="middle" font-weight="bold">开始测试</text>

<!-- FLOW 类 -->
<rect x="60" y="320" width="500" height="90" rx="2" fill="none" stroke="#3FC7AE" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<rect x="255" y="345" width="110" height="42" rx="8" fill="#EAF3FF" stroke="#5B8DD6" stroke-width="1.5"/>
<text x="310" y="360" font-size="10" fill="#C8642A" text-anchor="middle" font-family="monospace">FLOW-001</text>
<text x="310" y="375" font-size="13" fill="#12325C" text-anchor="middle" font-weight="bold">答题流程</text>

<!-- 橙色圆角标签（连接线标注） -->
<rect x="330" y="110" width="150" height="18" rx="9" fill="#FFF3E0" stroke="#F0A868" stroke-width="1"/>
<text x="405" y="122" font-size="9" fill="#6B3A12" text-anchor="middle">测试 覆盖 整个页面</text>

<!-- 连线：细实线 + 小三角 -->
<g stroke="#4FB79E" stroke-width="1" fill="none" marker-end="url(#ar)">
<path d="M150 97 L150 172"/>
<path d="M210 214 L210 250"/>
<path d="M310 97 L310 172"/>
<path d="M310 214 L310 345"/>
<path d="M310 387 L310 420"/>
</g>
<path d="M365 119 L500 119 L500 340 L365 340" stroke="#E8944A" stroke-width="1" stroke-dasharray="4 3" fill="none"/>

<!-- 右侧代码卡 -->
<rect x="590" y="40" width="290" height="200" rx="4" fill="#FBFCFE" stroke="#D8DCE3" stroke-width="1"/>
<text x="604" y="60" font-size="11" fill="#1B2E63" font-weight="bold">A 报错 · UI-001</text>
<rect x="840" y="50" width="30" height="14" rx="7" fill="#F5A623"/>
<text x="855" y="60" font-size="8" fill="#fff" text-anchor="middle">可复现</text>
<text x="604" y="82" font-size="9" fill="#5F6B7A">名称： 开始按钮</text>
<text x="604" y="98" font-size="9" fill="#5F6B7A">位置： 页面首页 /index</text>
<text x="604" y="114" font-size="9" fill="#C8642A">所属页面： CAP-001 用户完成 X</text>
<text x="604" y="130" font-size="9" fill="#5F6B7A">所属控件： PAGE-001 首页</text>
<text x="604" y="146" font-size="9" fill="#5F6B7A">触发时机： ACT-001 点击按钮</text>
<text x="604" y="162" font-size="9" fill="#5F6B7A">保存位置： STORE-001 读取答案</text>
<text x="604" y="178" font-size="9" fill="#5F6B7A">验证路径： TEST-003 测试验证</text>

<!-- 底部图例 -->
<rect x="60" y="450" width="500" height="150" rx="6" fill="#F3F4F8" stroke="#D8DCE3" stroke-width="1"/>
<text x="80" y="474" font-size="12" fill="#1B2E63" font-weight="bold">完整的逻辑地图，要回答这 9 个问题</text>
<g font-size="10" fill="#5F6B7A">
<text x="80" y="500">① 什么能力 CAP</text>
<text x="80" y="522">④ 用户做什么 ACT</text>
<text x="80" y="544">⑦ 走什么接口 API</text>
<text x="250" y="500">② 前端页面 PAGE</text>
<text x="250" y="522">⑤ 有什么流程 FLOW</text>
<text x="250" y="544">⑧ 怎么判定 RULE</text>
<text x="420" y="500">③ 有哪些按钮 UI</text>
<text x="420" y="522">⑥ 数据存什么 STORE</text>
<text x="420" y="544">⑨ 什么测试验证 TEST</text>
</g>

<rect x="60" y="580" width="820" height="26" rx="4" fill="#F3FCFB" stroke="#3FC7AE" stroke-width="1"/>
<text x="470" y="597" font-size="11" fill="#0B3B34" text-anchor="middle">让 AI 改代码前先回答：改什么？影响哪里？不能动什么？怎么验证？</text>
</svg>